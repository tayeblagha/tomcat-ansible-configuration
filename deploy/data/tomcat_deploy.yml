---
- hosts: all
  become: yes
  vars:
    jvm_heap_size: "{{ '256' if env == 'DEV' else '512' }}"
    tomcat_version: "9.0.54"
    tomcat_install_dir: "/opt/apache-tomcat-{{ tomcat_version }}"

  tasks:
    - name: Install Java
      apt:
        name: openjdk-11-jdk
        state: present


    - name: Download Tomcat
      get_url:
        url: "https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.54/bin/apache-tomcat-9.0.54.tar.gz"
        dest: /opt/
    - name: Extract Tomcat
      unarchive:
        src: /opt/apache-tomcat-9.0.54.tar.gz
        dest: /opt/
        remote_src: yes
    - name: Configure Tomcat Users
      template:
        src: tomcat-users.xml.j2
        dest: /opt/apache-tomcat-9.0.54/conf/tomcat-users.xml
    - name: Start Tomcat Service
      service:
        name: tomcat
        state: started
        enabled: yes