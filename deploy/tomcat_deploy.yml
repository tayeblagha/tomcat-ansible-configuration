---
- name: Deploy Tomcat
  hosts: all
  become: yes

  vars:
    tomcat_version: 9.0.85
    install_dir: /opt/tomcat

  tasks:
    - name: Install Java
      apt:
        name: openjdk-11-jdk
        state: present

    - name: Create Tomcat group
      group:
        name: tomcat
        state: present

    - name: Create Tomcat user
      user:
        name: tomcat
        group: tomcat
        shell: /bin/false
        home: "{{ install_dir }}"
        system: yes

    - name: Download Tomcat
      get_url:
        url: "https://archive.apache.org/dist/tomcat/tomcat-9/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: /tmp/tomcat.tar.gz

    - name: Remove existing Tomcat directory if present
      file:
        path: "{{ install_dir }}"
        state: absent

    - name: Create installation directory
      file:
        path: "{{ install_dir }}"
        state: directory
        owner: tomcat
        group: tomcat

    - name: Extract Tomcat
      unarchive:
        src: /tmp/tomcat.tar.gz
        dest: "{{ install_dir }}"
        remote_src: yes
        extra_opts: "--strip-components=1"
        owner: tomcat
        group: tomcat

    - name: Set directory permissions
      file:
        path: "{{ install_dir }}/webapps"
        mode: '0755'
        recurse: yes

    - name: Configure Environment Variables
      blockinfile:
        path: /etc/environment
        block: |
          CATALINA_HOME={{ install_dir }}
          JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64

    - name: Deploy sample.war
      get_url:
        url: https://tomcat.apache.org/tomcat-7.0-doc/appdev/sample/sample.war
        dest: "{{ install_dir }}/webapps/sample.war"
        owner: tomcat
        group: tomcat

    - name: Create Systemd Service
      copy:
        dest: /etc/systemd/system/tomcat.service
        content: |
          [Unit]
          Description=Apache Tomcat
          After=syslog.target network.target

          [Service]
          Type=forking
          User=tomcat
          Group=tomcat
          Environment=CATALINA_PID={{ install_dir }}/temp/tomcat.pid
          Environment=CATALINA_HOME={{ install_dir }}
          Environment=CATALINA_BASE={{ install_dir }}
          ExecStart={{ install_dir }}/bin/startup.sh
          ExecStop={{ install_dir }}/bin/shutdown.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Tomcat service
      systemd:
        name: tomcat
        state: started
        enabled: yes